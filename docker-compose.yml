services:
  postgres:
    image: postgres:15-alpine
    container_name: shiftsync-postgres
    environment:
      POSTGRES_USER: shiftsync
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shiftsync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: shiftsync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  postgres-data:
  redis-data:
